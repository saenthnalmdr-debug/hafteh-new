name: Build Hafteh APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        id: project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q Hafteh-new-project-source.zip -d extracted
          SETTINGS_FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found in the source ZIP."
            unzip -l Hafteh-new-project-source.zip
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Gradle settings found at $PROJECT_DIR, but app/build.gradle(.kts) is missing."
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project root: $PROJECT_DIR"

      - name: Inspect current app source for requested UI updates
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          echo "===== MAIN ACTIVITY SOURCE ====="
          find "$PROJECT_DIR" -type f -name '*.kt' -print
          find "$PROJECT_DIR" -type f -name 'MainActivity.kt' -exec cat {} \;
          echo "===== END MAIN ACTIVITY SOURCE ====="

      - name: Build debug APK
        run: gradle -p "${{ steps.project.outputs.project_dir }}" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hafteh-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
